# Service descriptions for the ZoneMinder integration.

trigger_event:
  target:
    entity:
      integration: zoneminder
      domain: camera
  fields:
    cause:
      required: false
      default: Home Assistant
      example: Doorbell pressed
      selector:
        text:

cancel_event:
  target:
    entity:
      integration: zoneminder
      domain: camera

ptz:
  target:
    entity:
      integration: zoneminder
      domain: camera
  fields:
    command:
      required: true
      example: left
      selector:
        select:
          translation_key: ptz_command
          options:
            - up
            - down
            - left
            - right
            - up-left
            - up-right
            - down-left
            - down-right
            - stop
            - zoom-in
            - zoom-out
            - zoom-stop
            - focus-near
            - focus-far
            - focus-auto
            - focus-stop
            - home
            - preset
    preset:
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 255
          mode: box

set_monitor_state:
  target:
    entity:
      integration: zoneminder
      domain: camera
  fields:
    capturing:
      required: false
      example: Always
      selector:
        select:
          options:
            - None
            - Ondemand
            - Always
    analysing:
      required: false
      example: Always
      selector:
        select:
          options:
            - None
            - Always
    recording:
      required: false
      example: OnMotion
      selector:
        select:
          options:
            - None
            - OnMotion
            - Always
    decoding:
      required: false
      example: Always
      selector:
        select:
          options:
            - None
            - Ondemand
            - KeyFrames
            - KeyFrames+Ondemand
            - Always
    function:
      required: false
      selector:
        select:
          options:
            - None
            - Monitor
            - Modect
            - Record
            - Mocord
            - Nodect

save_run_state:
  fields:
    name:
      required: true
      example: Away
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: zoneminder

set_run_state:
  fields:
    name:
      required: true
      example: Away
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: zoneminder
    id:
      required: false
      example: zm.local
      selector:
        text:

ptz_preset:
  target:
    entity:
      integration: zoneminder
      domain: camera
  fields:
    preset:
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 255
          mode: box

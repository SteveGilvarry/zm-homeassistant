# ZoneMinder Card - Example Configurations

# Basic 2x2 Grid
type: custom:zoneminder-card
title: Security Cameras
monitors:
  - entity: camera.front_door
  - entity: camera.backyard
  - entity: camera.garage
  - entity: camera.driveway
columns: 2
streaming_mode: webrtc
show_motion_indicator: true

---

# Advanced Configuration with Custom Names
type: custom:zoneminder-card
title: Perimeter Security
zoneminder_go2rtc_url: http://192.168.0.45:1984
monitors:
  - entity: camera.front_door
    stream_id: "1"
    name: "Main Entrance"
  - entity: camera.back_door
    stream_id: "2"
    name: "Rear Exit"
  - entity: camera.garage
    stream_id: "4"
    name: "Garage Door"
columns: 3
aspect_ratio: "16:9"
streaming_mode: webrtc
show_motion_indicator: true
show_controls: true
click_action: fullscreen

---

# Single Camera View
type: custom:zoneminder-card
monitors:
  - entity: camera.front_door
columns: 1
aspect_ratio: "16:9"
streaming_mode: webrtc
show_motion_indicator: true
click_action: fullscreen

---

# 4-Column Grid for Large Displays
type: custom:zoneminder-card
title: All Cameras
monitors:
  - entity: camera.cam1
  - entity: camera.cam2
  - entity: camera.cam3
  - entity: camera.cam4
  - entity: camera.cam5
  - entity: camera.cam6
  - entity: camera.cam7
  - entity: camera.cam8
columns: 4
aspect_ratio: "16:9"
streaming_mode: webrtc
show_motion_indicator: true

---

# MSE Mode (Fallback for browsers without WebRTC)
type: custom:zoneminder-card
title: Cameras (MSE Mode)
monitors:
  - entity: camera.front_door
  - entity: camera.backyard
columns: 2
streaming_mode: mse
show_motion_indicator: true


[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # function calls in argument defaults (HA selectors)
    "SIM102", # nested if statements can read more clearly
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E", "F", "B", "SIM", "UP", "C4", "I"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["custom_components/zoneminder"]

# ZoneMinder Card Configuration
# Copy and paste this into your Home Assistant dashboard

# Option 1: All 4 Cameras (Recommended)
type: custom:zoneminder-card
title: Security Cameras
zoneminder_go2rtc_url: http://192.168.0.45:1984
monitors:
  - entity: camera.hikvision_ds_2cd2087g2_lu
    stream_id: "1"
    name: "Front Camera"
  - entity: camera.driveway_east
    stream_id: "2"
    name: "Driveway"
  - entity: camera.laneway_south_high_res
    stream_id: "3"
    name: "Laneway"
  - entity: camera.hikvision_ds_2cd2642fwd_izs
    stream_id: "4"
    name: "Back Camera"
columns: 2
streaming_mode: webrtc
show_motion_indicator: true
show_controls: false
click_action: fullscreen

---
# Option 2: Just Active Cameras (2 cameras)
type: custom:zoneminder-card
title: Active Cameras
zoneminder_go2rtc_url: http://192.168.0.45:1984
monitors:
  - entity: camera.hikvision_ds_2cd2087g2_lu
  - entity: camera.driveway_east
columns: 2
streaming_mode: webrtc
show_motion_indicator: true

---
# Option 3: Single Large Camera
type: custom:zoneminder-card
zoneminder_go2rtc_url: http://192.168.0.45:1984
monitors:
  - entity: camera.hikvision_ds_2cd2087g2_lu
    name: "Front Door"
columns: 1
aspect_ratio: "16:9"
streaming_mode: webrtc
show_motion_indicator: true

---
# Option 4: 2x2 Grid (4 cameras)
type: custom:zoneminder-card
title: All Cameras
zoneminder_go2rtc_url: http://192.168.0.45:1984
monitors:
  - entity: camera.hikvision_ds_2cd2087g2_lu
  - entity: camera.driveway_east
  - entity: camera.laneway_south_high_res
  - entity: camera.hikvision_ds_2cd2642fwd_izs
columns: 2
streaming_mode: webrtc
show_motion_indicator: true

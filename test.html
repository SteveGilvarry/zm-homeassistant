<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoneMinder Card Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
      color: #333;
    }

    .test-section {
      margin: 30px 0;
      padding: 20px;
      background: #fafafa;
      border-radius: 4px;
    }

    .test-section h2 {
      margin-top: 0;
      font-size: 18px;
      color: #666;
    }

    zoneminder-card {
      display: block;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ZoneMinder Card - Aspect Ratio Test</h1>

    <div class="test-section">
      <h2>Test 1: Default (16:9, 2 columns)</h2>
      <zoneminder-card id="card1"></zoneminder-card>
    </div>

    <div class="test-section">
      <h2>Test 2: Square aspect ratio (1:1, 3 columns)</h2>
      <zoneminder-card id="card2"></zoneminder-card>
    </div>

    <div class="test-section">
      <h2>Test 3: 4:3 aspect ratio (1 column)</h2>
      <zoneminder-card id="card3"></zoneminder-card>
    </div>

    <div class="test-section">
      <h2>Test 4: Mixed span sizes (16:9, 2 columns with one monitor spanning 2x2)</h2>
      <zoneminder-card id="card4"></zoneminder-card>
    </div>
  </div>

  <script type="module" src="dist/zoneminder-card.js"></script>
  <script type="module">
    // Mock Home Assistant
    const mockHass = {
      states: {
        'camera.front_door': {
          entity_id: 'camera.front_door',
          state: 'idle',
          attributes: {
            friendly_name: 'Front Door',
            go2rtc_url: 'http://localhost:1984',
            go2rtc_stream_id: 'front_door',
            monitor_id: '1',
            orientation: 'Normal'
          }
        },
        'camera.backyard': {
          entity_id: 'camera.backyard',
          state: 'idle',
          attributes: {
            friendly_name: 'Backyard',
            go2rtc_url: 'http://localhost:1984',
            go2rtc_stream_id: 'backyard',
            monitor_id: '2',
            orientation: 'Normal'
          }
        },
        'camera.garage': {
          entity_id: 'camera.garage',
          state: 'idle',
          attributes: {
            friendly_name: 'Garage',
            go2rtc_url: 'http://localhost:1984',
            go2rtc_stream_id: 'garage',
            monitor_id: '3',
            orientation: 'Normal'
          }
        },
        'camera.driveway': {
          entity_id: 'camera.driveway',
          state: 'idle',
          attributes: {
            friendly_name: 'Driveway',
            go2rtc_url: 'http://localhost:1984',
            go2rtc_stream_id: 'driveway',
            monitor_id: '4',
            orientation: 'Normal'
          }
        },
        'binary_sensor.front_door_motion': {
          entity_id: 'binary_sensor.front_door_motion',
          state: 'on'
        }
      }
    };

    // Test 1: Default 16:9, 2 columns
    const card1 = document.getElementById('card1');
    card1.setConfig({
      type: 'custom:zoneminder-card',
      title: 'Security Cameras',
      monitors: [
        { entity: 'camera.front_door' },
        { entity: 'camera.backyard' },
        { entity: 'camera.garage' },
        { entity: 'camera.driveway' }
      ],
      columns: 2,
      aspect_ratio: '16:9',
      streaming_mode: 'webrtc',
      show_motion_indicator: true,
      zoneminder_go2rtc_url: 'http://localhost:1984'
    });
    card1.hass = mockHass;

    // Test 2: Square 1:1, 3 columns
    const card2 = document.getElementById('card2');
    card2.setConfig({
      type: 'custom:zoneminder-card',
      title: 'Square Cameras',
      monitors: [
        { entity: 'camera.front_door' },
        { entity: 'camera.backyard' },
        { entity: 'camera.garage' }
      ],
      columns: 3,
      aspect_ratio: '1:1',
      streaming_mode: 'webrtc',
      show_motion_indicator: true,
      zoneminder_go2rtc_url: 'http://localhost:1984'
    });
    card2.hass = mockHass;

    // Test 3: 4:3, 1 column
    const card3 = document.getElementById('card3');
    card3.setConfig({
      type: 'custom:zoneminder-card',
      title: 'Full Width Camera',
      monitors: [
        { entity: 'camera.front_door' }
      ],
      columns: 1,
      aspect_ratio: '4:3',
      streaming_mode: 'webrtc',
      show_motion_indicator: true,
      zoneminder_go2rtc_url: 'http://localhost:1984'
    });
    card3.hass = mockHass;

    // Test 4: Mixed spans
    const card4 = document.getElementById('card4');
    card4.setConfig({
      type: 'custom:zoneminder-card',
      title: 'Mixed Layout',
      monitors: [
        { entity: 'camera.front_door', columns: 2, rows: 2 },
        { entity: 'camera.backyard' },
        { entity: 'camera.garage' }
      ],
      columns: 2,
      aspect_ratio: '16:9',
      streaming_mode: 'webrtc',
      show_motion_indicator: true,
      zoneminder_go2rtc_url: 'http://localhost:1984'
    });
    card4.hass = mockHass;
  </script>
</body>
</html>

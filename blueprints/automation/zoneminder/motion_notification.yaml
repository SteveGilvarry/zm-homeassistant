blueprint:
  name: ZoneMinder event notification
  description: >-
    Sends a phone notification with a picture when a ZoneMinder camera sees
    motion. When the recording finishes, the same notification is updated with
    a button that plays the clip.


    Motion only fires on cameras with analysis switched on. A camera that
    records continuously opens a new event every few minutes without ever
    detecting motion, so pick "Recording" below only if you really want those.


    The picture and clip links open that one event and nothing else, and keep
    working after Home Assistant restarts.
  domain: automation
  source_url: https://github.com/stevengilvarry/zmha/blob/main/blueprints/automation/zoneminder/motion_notification.yaml
  input:
    cameras:
      name: Cameras
      description: The ZoneMinder event entities to watch, one per camera.
      selector:
        entity:
          multiple: true
          filter:
            - integration: zoneminder
              domain: event
    event_types:
      name: Notify on
      default: [motion]
      selector:
        select:
          multiple: true
          options:
            - label: Motion
              value: motion
            - label: Recording (continuous cameras open one every few minutes)
              value: recording
    notify_target:
      name: Notification action
      description: The notify action to call, such as notify.mobile_app_your_phone.
      default: notify.notify
      selector:
        text:
    title:
      name: Title
      description: "Supports templates: {{ camera_name }} and {{ objects }}."
      default: "{{ camera_name }}"
      selector:
        text:
    message:
      name: Message
      description: "Supports templates: {{ camera_name }}, {{ what }}, {{ cause }} and {{ objects }}."
      default: "{{ what }} at {{ now().strftime('%H:%M') }}"
      selector:
        text:
    open_path:
      name: Open when tapped
      description: The Home Assistant page the notification opens.
      default: /lovelace/0
      selector:
        text:
    cooldown:
      name: Cooldown
      description: How long to stay quiet after a notification.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: slider
    only_when_away:
      name: Only notify when these are away
      description: Leave empty to always notify.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: person
            - domain: device_tracker

# Each event waits for its own clip, so several can be in flight at once.
mode: parallel
max: 10

variables:
  wanted_types: !input event_types
  presence: !input only_when_away
  cooldown: !input cooldown
  open_path: !input open_path

triggers:
  - trigger: state
    entity_id: !input cameras
    # An event entity that has never fired is "unknown", so that is a fine
    # place to come from. Startup is kept quiet by the integration itself.
    not_from: [unavailable]
    not_to: [unavailable, unknown]

conditions:
  - condition: template
    value_template: "{{ trigger.to_state.attributes.event_type in wanted_types }}"
  - condition: template
    value_template: >-
      {{ presence | length == 0
         or presence | select('is_state', 'home') | list | length == 0 }}
  - condition: template
    value_template: >-
      {% set last = this.attributes.last_triggered %}
      {{ last is none or (now() - last).total_seconds() > cooldown }}

actions:
  - variables:
      attrs: "{{ trigger.to_state.attributes }}"
      event_id: "{{ attrs.event_id }}"
      camera_name: >-
        {{ (device_attr(device_id(trigger.entity_id), 'name_by_user')
            or device_attr(device_id(trigger.entity_id), 'name')
            or trigger.to_state.name) }}
      cause: "{{ attrs.cause or '' }}"
      objects: "{{ (attrs.detected_objects or []) | join(', ') }}"
      # "Person, car", or failing that what kind of event this is.
      what: >-
        {{ (objects or ('Motion' if attrs.event_type == 'motion' else 'Recording'))
           | capitalize }}
      tag: "zoneminder-{{ event_id }}"
      thumbnail: "{{ attrs.thumbnail_url }}"
      clip: "{{ attrs.clip_url }}"
  - action: !input notify_target
    data:
      title: !input title
      message: !input message
      data:
        tag: "{{ tag }}"
        group: zoneminder
        channel: ZoneMinder
        thread-id: "{{ trigger.entity_id }}"
        image: "{{ thumbnail }}"
        url: "{{ open_path }}"
        clickAction: "{{ open_path }}"
  # The clip only exists once ZoneMinder closes the event.
  - wait_for_trigger:
      - trigger: template
        value_template: >-
          {{ state_attr(trigger.entity_id, 'event_type') == 'ended'
             and state_attr(trigger.entity_id, 'event_id') == event_id }}
    timeout: "00:30:00"
    continue_on_timeout: false
  - action: !input notify_target
    data:
      title: !input title
      message: !input message
      data:
        tag: "{{ tag }}"
        group: zoneminder
        channel: ZoneMinder
        thread-id: "{{ trigger.entity_id }}"
        image: "{{ thumbnail }}"
        video: "{{ clip }}"
        url: "{{ open_path }}"
        clickAction: "{{ open_path }}"
        # Updating a notification shouldn't buzz the phone a second time.
        alert_once: true
        push:
          interruption-level: passive
        actions:
          - action: URI
            title: Play clip
            uri: "{{ clip }}"
